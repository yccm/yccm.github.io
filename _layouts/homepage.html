<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="{{ site.description }}">
    {% if site.keywords %}
    <meta name="keywords" content="{{ site.keywords }}">
    {% endif %}
    {% if site.canonical %}
    <link rel="canonical" href="{{ site.canonical }}"/>
    {% endif %}
    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark }}" type="image/png"/>
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon }}" type="image/png"/>
<link rel="stylesheet" href="./assets/css/style.css" type="text/css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<script src="./assets/js/news-toggle.js"></script>
<title>{{ site.title }} | {{site.affiliation}}</title>
</head>
<body>
{% include navbar.html %}
<main class="page">
{{ content }}
<p hidden><script type="text/javascript" id="clustrmaps" src="//cdn.clustrmaps.com/map_v2.js?d=0BV5WWkvubBh6O72_ES-0aHY-MlDJXUC2LUHQid3A4A&cl=ffffff&w=a"></script></p>
<footer class="site-footer">
  &copy; 2026 Yuchen Ma &middot; Powered by <a href="https://jekyllrb.com/">Jekyll</a>
</footer>
</main>
<button id="back-to-top" aria-label="Back to top" title="Back to top">&uarr;</button>
<script src="./assets/js/ui.js"></script>
</body>
</html>
